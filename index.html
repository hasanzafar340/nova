<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b0f"
    >

    <title>Nova — Voice Assistant</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app-shell">

    <main class="main">

        <!-- TOP BAR -->
        <header class="topbar">

            <div class="brand">

                <!-- <div class="brand-mark">
                    N
                </div> -->

                <div class="brand-info">

                    <h1>Nova</h1>

                    <span>
                        Voice Assistant Developed by Bits & Bytes
                    </span>

                </div>

            </div>


            <div class="topbar-right">

                <!-- LANGUAGE -->

                <div class="language-selector">

                    <button
                        class="language-btn active"
                        data-language="auto"
                    >
                        Auto
                    </button>

                    <button
                        class="language-btn"
                        data-language="ur-PK"
                    >
                        اردو
                    </button>

                    <button
                        class="language-btn"
                        data-language="en-US"
                    >
                        English
                    </button>

                </div>


                <div class="header-divider"></div>


                <div class="status">

                    <span
                        class="status-dot"
                    ></span>

                    <span id="statusText">
                        Ready
                    </span>

                </div>


                <button
                    id="clearChatButton"
                    class="clear-chat"
                >
                    Clear
                </button>

            </div>

        </header>


        <!-- CHAT -->

        <section
            id="chatContainer"
            class="chat-container"
        >

            <div
                id="welcomeScreen"
                class="welcome-screen"
            >

                <div class="nova-orb">

                    <div class="orb-inner">
                        N
                    </div>

                </div>

                <h2>
                    How can I help?
                </h2>

                <p>
                    Ask Nova a question in
                    English or Urdu.
                </p>

            </div>

        </section>


        <!-- COMPOSER -->

        <section class="composer-area">

            <div
                id="listeningIndicator"
                class="listening-indicator"
            >

                <span class="wave"></span>
                <span class="wave"></span>
                <span class="wave"></span>

                <span>
                    Listening...
                </span>

            </div>


            <div class="composer">

                <button
                    id="micButton"
                    class="mic-button"
                    aria-label="Start listening"
                >
                    <span class="mic-symbol"></span>
                </button>


                <input
                    id="textInput"
                    type="text"
                    autocomplete="off"
                    placeholder="Ask Nova anything..."
                >


                <button
                    id="sendButton"
                    class="send-button"
                    aria-label="Send message"
                >
                    ↑
                </button>

            </div>


            <div class="composer-footer">

                <span>
                    Nova answers from your
                    knowledge base
                </span>

                <button
                    id="stopButton"
                    class="stop-button"
                >
                    Stop
                </button>

            </div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>

</html>
